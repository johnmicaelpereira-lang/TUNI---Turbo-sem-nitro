<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="820" height="500" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold">TUNI — Desenho básico de ligações (ESP32 + L298N)</text>

  <rect x="40" y="70" width="190" height="300" rx="8" fill="#eef3ff" stroke="#223" stroke-width="2"/>
  <text x="135" y="95" text-anchor="middle" font-weight="bold">ESP32 DevKit V1</text>
  <text x="215" y="140" text-anchor="end">GPIO 23</text>
  <text x="215" y="170" text-anchor="end">GPIO 21</text>
  <text x="215" y="200" text-anchor="end">GPIO 22</text>
  <text x="215" y="230" text-anchor="end">GPIO 5</text>
  <text x="215" y="260" text-anchor="end">GPIO 19</text>
  <text x="215" y="290" text-anchor="end">GPIO 18</text>
  <text x="215" y="320" text-anchor="end">GND</text>
  <text x="215" y="350" text-anchor="end">VIN</text>

  <rect x="420" y="70" width="190" height="340" rx="8" fill="#fff0f0" stroke="#322" stroke-width="2"/>
  <text x="515" y="95" text-anchor="middle" font-weight="bold">Ponte H L298N</text>
  <text x="435" y="140">ENA</text>
  <text x="435" y="170">IN1</text>
  <text x="435" y="200">IN2</text>
  <text x="435" y="230">ENB</text>
  <text x="435" y="260">IN3</text>
  <text x="435" y="290">IN4</text>
  <text x="435" y="320">GND</text>
  <text x="435" y="350">+5 V</text>
  <text x="595" y="140" text-anchor="end">OUT1/OUT2</text>
  <text x="595" y="260" text-anchor="end">OUT3/OUT4</text>
  <text x="595" y="380" text-anchor="end">12 V (entrada)</text>
  <text x="515" y="402" text-anchor="middle">GND (bateria)</text>

  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="230" y1="135" x2="420" y2="135"/>
    <line x1="230" y1="165" x2="420" y2="165"/>
    <line x1="230" y1="195" x2="420" y2="195"/>
    <line x1="230" y1="225" x2="420" y2="225"/>
    <line x1="230" y1="255" x2="420" y2="255"/>
    <line x1="230" y1="285" x2="420" y2="285"/>
    <line x1="230" y1="315" x2="420" y2="315" stroke="#000" stroke-width="3"/>
  </g>
  <text x="325" y="128" text-anchor="middle" font-size="12">PWM esquerdo</text>
  <text x="325" y="218" text-anchor="middle" font-size="12">PWM direito</text>
  <text x="325" y="308" text-anchor="middle" font-size="12">GND comum</text>

  <!-- 5 V -> VIN (direto) -->
  <line x1="420" y1="345" x2="230" y2="345" stroke="#c00" stroke-width="3"/>
  <text x="325" y="338" text-anchor="middle" font-size="12" fill="#c00">5 V da L298N → VIN</text>

  <!-- motores -->
  <line x1="610" y1="135" x2="690" y2="135" stroke="#333" stroke-width="2"/>
  <line x1="610" y1="255" x2="690" y2="255" stroke="#333" stroke-width="2"/>
  <circle cx="725" cy="135" r="32" fill="#fff8d6" stroke="#333" stroke-width="2"/>
  <text x="725" y="132" text-anchor="middle" font-size="12">Motor</text>
  <text x="725" y="148" text-anchor="middle" font-size="12">esquerdo</text>
  <circle cx="725" cy="255" r="32" fill="#fff8d6" stroke="#333" stroke-width="2"/>
  <text x="725" y="252" text-anchor="middle" font-size="12">Motor</text>
  <text x="725" y="268" text-anchor="middle" font-size="12">direito</text>

  <!-- bateria -->
  <rect x="560" y="440" width="190" height="46" rx="6" fill="#e8ffe8" stroke="#232" stroke-width="2"/>
  <text x="655" y="468" text-anchor="middle">Bateria (2 x 3,7 V)</text>
  <line x1="700" y1="440" x2="700" y2="425" stroke="#c00" stroke-width="3"/>
  <rect x="660" y="395" width="80" height="30" rx="5" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="700" y="415" text-anchor="middle" font-size="13">Chave</text>
  <polyline points="700,395 700,375 610,375" fill="none" stroke="#c00" stroke-width="3"/>
  <text x="640" y="368" font-size="12" fill="#c00">positivo</text>
  <polyline points="560,463 515,463 515,410" fill="none" stroke="#000" stroke-width="3"/>
  <text x="525" y="440" font-size="12">negativo</text>

  <text x="40" y="490" font-size="11" fill="#555">Desenho básico, sem valores de componentes. GND comum entre ESP32, L298N e bateria.</text>
</svg>
